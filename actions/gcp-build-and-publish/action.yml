name: 'GCP Build and Publish'
description: |
  Builds Maven projects and publishes to GCP Artifact Registry.
  
  **Required**: Caller workflow must run `actions/checkout` before this action so
  `pom.xml` files exist for Maven cache key hashing.
  
  **Maven cache**: Restore/cache `~/.m2/repository` in the workflow **before** this action
  (e.g. `actions/cache` or `actions/setup-java` with `cache: maven`). Do not duplicate
  both—use one approach only.
  
  This action handles:
  - Maven package building and deployment to GCP Artifact Registry
  - GraalVM **native** Docker images via `spring-boot-maven-plugin` (`build-image-no-fork` when
    consumer POM sets `-DskipImage=false`; Paketo `BP_NATIVE_IMAGE=true`)
  - Docker image publishing to GCP Artifact Registry (PR + master deploy paths)
  - Linux runner swap for native-image compile memory (configurable)
  - Version management (auto-generated for master, custom for PRs)
  - Optional: Java test/coverage reports (JaCoCo HTML, Surefire/Failsafe XML) as workflow artifacts
  - Optional: Markdown **job summary** (coverage table + Surefire totals) on the workflow run page
  
  **Artifacts**: Enable `upload-java-reports` (default) and grant the workflow `permissions.actions: write`
  so reports appear under Actions → run → Artifacts.
  
  **Job summary**: Enable `java-job-summary` (default). Open the workflow run → **Summary** tab for the table.
  No extra permissions beyond the default `GITHUB_TOKEN`.
  
  Authenticate with **either** Workload Identity Federation (`workload-identity-provider` + `service-account-email`)
  **or** a JSON key (`gcp-credentials`). When the WIF inputs are both non-empty, the JSON key is ignored.

  This is a GCP-specific implementation. For other cloud providers, use their respective actions.

inputs:
  gcp-credentials:
    description: 'GCP service account credentials JSON (used when WIF inputs are unset)'
    required: false
    default: ''
  workload-identity-provider:
    description: 'Full workload_identity_provider resource name (pass from workflow secrets)'
    required: false
    default: ''
  service-account-email:
    description: 'GCP service account email for WIF (pass from workflow secrets or variables)'
    required: false
    default: ''
  maven-repository:
    description: 'Maven repository name'
    required: false
  maven-location:
    description: 'Maven repository location (default: us-central1)'
    required: false
    default: 'us-central1'
  docker-registry:
    description: 'Docker registry URL'
    required: false
  event-type:
    description: 'Event type: pull_request or push'
    required: true
  branch-ref:
    description: 'Git branch reference'
    required: true
  upload-java-reports:
    description: 'Upload JaCoCo and Surefire/Failsafe reports as workflow artifacts (requires workflow permission actions:write)'
    required: false
    default: 'true'
  java-reports-retention-days:
    description: 'Days to keep java-reports artifacts'
    required: false
    default: '14'
  java-job-summary:
    description: 'Append JaCoCo/Surefire Markdown to the job Summary tab (GITHUB_STEP_SUMMARY)'
    required: false
    default: 'true'
  native-image-swap-gb:
    description: 'Swap space (GB) on Linux runners before native Docker image build (0 to skip)'
    required: false
    default: '8'

outputs:
  repository-url:
    description: 'Maven repository URL'
    value: ${{ steps.maven-config.outputs.repository-url }}
  version:
    description: 'Version used for build'
    value: ${{ steps.build.outputs.version }}

runs:
  using: 'composite'
  steps:
    # Git Configuration (split into git-config action)
    - name: Configure Git
      shell: bash
      run: |
        bash .github/scripts/configure-git.sh

    - name: Authenticate to Google Cloud (Workload Identity Federation)
      if: inputs.workload-identity-provider != '' && inputs.service-account-email != ''
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account-email }}

    - name: Authenticate to Google Cloud (service account key)
      if: (inputs.workload-identity-provider == '' || inputs.service-account-email == '') && inputs.gcp-credentials != ''
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ inputs.gcp-credentials }}

    - name: Fail if GCP auth is not configured
      if: (inputs.workload-identity-provider == '' || inputs.service-account-email == '') && inputs.gcp-credentials == ''
      shell: bash
      run: |
        echo "::error::Provide either workload-identity-provider + service-account-email (WIF) or gcp-credentials (JSON key)."
        exit 1

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3

    # Maven ~/.m2/repository cache is owned by the caller workflow (setup-java cache: maven
    # and/or actions/cache) to avoid duplicate keys and failed cache saves.

    # Maven Configuration (split into gcp-maven-config action)
    - name: Configure Maven for GCP Artifact Registry
      id: maven-config
      if: inputs.event-type == 'pull_request' || (inputs.event-type == 'push' && inputs.branch-ref == 'refs/heads/master')
      shell: bash
      run: |
        bash .github/scripts/configure-maven-artifact-registry.sh
      env:
        MAVEN_REPOSITORY_VAR: ${{ inputs.maven-repository }}
        MAVEN_LOCATION_VAR: ${{ inputs.maven-location }}

    # Extract Repository URL (split into repo-url action)
    - name: Extract Repository URL
      id: repo-url
      if: inputs.event-type == 'pull_request' || (inputs.event-type == 'push' && inputs.branch-ref == 'refs/heads/master')
      shell: bash
      run: |
        # Read repository URL from maven-config output
        REPO_URL="${{ steps.maven-config.outputs.repository-url }}"
        if [ -n "${REPO_URL}" ]; then
          echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
          echo "Repository URL extracted: ${REPO_URL}"
        else
          echo "::error::Repository URL not found in maven-config outputs"
          exit 1
        fi

    # Docker Configuration (split into gcp-docker-config action)
    - name: Configure Docker for GCP Artifact Registry
      if: inputs.event-type == 'pull_request' || (inputs.event-type == 'push' && inputs.branch-ref == 'refs/heads/master')
      shell: bash
      run: |
        bash .github/scripts/configure-docker-artifact-registry.sh
      env:
        DOCKER_REGISTRY: ${{ inputs.docker-registry }}

    - name: Prepare GraalVM native image build
      if: inputs.event-type == 'pull_request' || (inputs.event-type == 'push' && inputs.branch-ref == 'refs/heads/master')
      shell: bash
      run: bash .github/scripts/prepare-graalvm-native-build.sh
      env:
        NATIVE_IMAGE_SWAP_GB: ${{ inputs.native-image-swap-gb }}

    - name: Build and Publish
      id: build
      shell: bash
      run: |
        if [ "${{ inputs.event-type }}" == "pull_request" ]; then
          # PR to master: deploy with version from POM + branch name + commit hash
          bash .github/scripts/build-pr-version.sh
          # Extract version for output
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
        elif [ "${{ inputs.event-type }}" == "push" ] && [ "${{ inputs.branch-ref }}" == "refs/heads/master" ]; then
          # Merge to master: automatically generate version and publish
          source .github/scripts/generate-version.sh
          bash .github/scripts/build-master-version.sh
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
        else
          # Other: just build
          mvn clean package -Dmaven.javadoc.skip=true
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
        fi
      env:
        MAVEN_REGISTRY: ${{ env.MAVEN_REGISTRY }}
        MAVEN_REPOSITORY: ${{ env.MAVEN_REPOSITORY }}
        DOCKER_REGISTRY: ${{ inputs.docker-registry }}
        DOCKER_REPOSITORY: ${{ env.DOCKER_REPOSITORY }}
        REPO_URL: ${{ env.REPO_URL }}

    - name: Java test and coverage summary (job summary)
      if: always() && inputs.java-job-summary == 'true'
      shell: bash
      run: bash .github/scripts/jacoco-github-step-summary.sh

    - name: Upload Java test and coverage reports
      if: always() && inputs.upload-java-reports == 'true'
      uses: actions/upload-artifact@v5
      with:
        name: java-reports-${{ github.run_id }}
        path: |
          **/target/site/jacoco/
          **/target/site/jacoco-unit-test-coverage-report/
          **/target/surefire-reports/
          **/target/failsafe-reports/
        if-no-files-found: warn
        retention-days: ${{ inputs.java-reports-retention-days }}

