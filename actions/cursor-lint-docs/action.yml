name: Cursor lint — docs (Prettier)
description: Strict Markdown Prettier check using mclebtec/.github/config/markdown

inputs:
  org-github-ref:
    description: mclebtec/.github ref (branch or tag)
    required: false
    default: master
  require-docs-hub:
    description: Fail if README.md or docs/README.md missing
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Checkout org config + lint scripts
      uses: actions/checkout@v6
      with:
        repository: mclebtec/.github
        ref: ${{ inputs.org-github-ref }}
        path: .mclebtec-github
        sparse-checkout: |
          config/markdown
          scripts/lint
        sparse-checkout-cone-mode: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Strict docs lint
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${{ inputs.require-docs-hub }}" == "true" ]]; then
          test -f README.md
          test -f docs/README.md
        fi
        chmod +x .mclebtec-github/scripts/lint/format-markdown.sh
        .mclebtec-github/scripts/lint/format-markdown.sh --check
