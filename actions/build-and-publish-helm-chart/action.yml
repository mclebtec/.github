name: 'Build and Publish Helm Charts'
description: 'Build and publish all Helm charts found in opt/helm directories to GCP Artifact Registry'

inputs:
  chart_version:
    description: 'Chart version to use'
    required: false
    default: '0.1.0'
  app_version:
    description: 'App version to use'
    required: false
    default: '1.0.0'
  docker_registry:
    description: 'Docker registry URL'
    required: true
  docker_repository:
    description: 'Docker repository path'
    required: true
  gcp_project_id:
    description: 'GCP Project ID'
    required: true
  helm_suffix:
    description: 'Suffix to add to chart names in registry'
    required: false
    default: 'helm'
  github_token:
    description: 'GitHub token for creating releases'
    required: false
    default: ''
  gcp_credentials:
    description: 'GCP service account JSON for auth'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Authenticate to Google Cloud
      if: inputs.gcp_credentials != ''
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ inputs.gcp_credentials }}

    - name: Set up Cloud SDK
      if: inputs.gcp_credentials != ''
      uses: google-github-actions/setup-gcloud@v3

    - name: Set up Helm
      shell: bash
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        helm version

    - name: Configure Helm for Artifact Registry
      shell: bash
      env:
        DOCKER_REGISTRY: ${{ inputs.docker_registry }}
      run: |
        gcloud auth configure-docker "${{ inputs.docker_registry }}" --quiet
        gcloud auth print-access-token | helm registry login "${{ inputs.docker_registry }}" \
          --username oauth2accesstoken \
          --password-stdin

    - name: Find and process Helm charts
      shell: bash
      env:
        CHART_VERSION: ${{ inputs.chart_version }}
        APP_VERSION: ${{ inputs.app_version }}
        DOCKER_REGISTRY: ${{ inputs.docker_registry }}
        DOCKER_REPOSITORY: ${{ inputs.docker_repository }}
        GCP_PROJECT_ID: ${{ inputs.gcp_project_id }}
        PUSH_CHARTS: 'false'
        CREATE_RELEASES: 'false'
        HELM_SUFFIX: ${{ inputs.helm_suffix }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        bash .github/scripts/build-and-publish-helm-chart.sh

    - name: Push Helm charts to Artifact Registry
      shell: bash
      run: |
        OCI_REGISTRY="oci://${{ inputs.docker_registry }}/${{ inputs.docker_repository }}/${{ inputs.helm_suffix }}"
        mkdir -p .helm-build
        for tgz in .helm-build/*.tgz; do
          [ -f "$tgz" ] || continue
          echo "Pushing $tgz to $OCI_REGISTRY"
          helm push "$tgz" "$OCI_REGISTRY"
        done
        echo "Charts pushed to $OCI_REGISTRY"
