name: Shell lint

on:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/shell-lint.yml"

permissions:
  contents: read

jobs:
  shfmt-shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install shfmt and shellcheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck curl
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64 -o /tmp/shfmt
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt

      - name: shfmt (scripts/)
        shell: bash
        run: |
          set -euo pipefail
          shfmt -d -i 2 -ci -bn -sr scripts/

      - name: shellcheck (scripts/)
        shell: bash
        run: |
          set -euo pipefail
          shellcheck scripts/*.sh